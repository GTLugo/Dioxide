[workspace]
default-members = ["crates/dioxide_boot"]
members = [
  "crates/dioxide", 
  "crates/dioxide_boot",
  "crates/dioxide_derive",
]
resolver = "3"

[workspace.package]
readme      = "README.md"
description = "A barebones OS built in Rust"
edition     = "2024"
authors     = ["Gabriel Lugo <dev.gabriel.lugo@gmail.com>"]
license     = "MIT"
keywords    = ["dioxide", "os", "o2"]
categories  = ["operating systems"]
repository  = "https://github.com/dioxide-os/dioxide"