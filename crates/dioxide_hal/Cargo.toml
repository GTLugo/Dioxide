[package]
name    = "dioxide-hal"
version = "0.0.1"

readme.workspace = true
description.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
bootloader_api = "0.11.x"
thiserror = { version = "2.0.x", default-features = false }
embedded-graphics = "0.8.x"
log = { version = "0.4.x", default-features = false }
conquer-once = { version = "0.4.0", default-features = false } # remove once the std lib is usable
once_cell = { version = "1.20.x", default-features = false } 

bootloader-x86_64-common = { version = "0.11.3", optional = true }

[features]
default = ["x86"]
rpi5 = []
x86 = ["dep:bootloader-x86_64-common"]
